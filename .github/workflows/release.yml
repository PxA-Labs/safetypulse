name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the package once, publishes it to TestPyPI, installs it from there
# as a smoke test, then publishes the same files to PyPI. Authentication is PyPI Trusted Publishing (OIDC): no API
# token is stored anywhere. Each upload carries PEP 740 build attestations.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Check that the tag matches the package version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          init=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('safetypulse/__init__.py').read())[1])")
          if [ "$TAG" != "v$version" ] || [ "$init" != "$version" ]; then
            echo "::error::tag $TAG, pyproject $version and __version__ $init must agree (tag = v<version>)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 30

  testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/safetypulse/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  verify:
    name: install from TestPyPI
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the published version and run the CLI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --upgrade pip
          /tmp/v/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          # TestPyPI serves only safetypulse; its dependencies come from PyPI. Retry while the index propagates.
          for i in 1 2 3 4 5 6; do
            /tmp/v/bin/pip install --no-cache-dir --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ "safetypulse==$VERSION" && break
            sleep 20
          done
          cd /tmp
          /tmp/v/bin/safetypulse --help > /dev/null
          /tmp/v/bin/python -c "import safetypulse, sys; assert safetypulse.__version__ == sys.argv[1]; print('safetypulse', safetypulse.__version__)" "$VERSION"

  pypi:
    name: publish to PyPI
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/safetypulse/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
