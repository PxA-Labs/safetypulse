# Link checker configuration (.github/workflows/links.yml).
max_retries = 3
timeout = 30
# github.com answers bursts of parallel requests with HTTP/2 protocol errors (PR #168: 63 of 77 errors were these on
# links that resolve). Fewer parallel requests and a pause before each retry keep the check within its limits.
max_concurrency = 8
retry_wait_time = 5
accept = [200, 206, 429]
exclude_path = ["graphify-out", "brag-output", ".venv", "kaggle/executed"]
exclude = [
  # Private by design: owner-only Kaggle notebooks and datasets, and the withheld Hugging Face repos.
  '^https://www\.kaggle\.com/',
  '^https://huggingface\.co/datasets/purvansh01/safetypulse-(jobs|withheld)',
  # Stage 2: the Earth probe bundle stays private (the other Stage 2 repos are public since 2026-11-21).
  '^https://huggingface\.co/datasets/purvansh01/safetypulse-earth-probe-bundle',
  # Stage 2 CircuitQuant release: private by owner decision (2026-11-26); remove this entry only if they are made public.
  '^https://huggingface\.co/(datasets/)?purvansh01/(tiny-aya-global-CircuitQuant-|aya-expanse-8b-CircuitQuant-|aya-expanse-8b-safetypulse-lora-alpaca-default|safetypulse-circuitquant-results|alpaca-curatorkit-rejected)',
  # Hugging Face Jobs pages are owner-only and answer anonymous requests with 202.
  '^https://huggingface\.co/jobs/',
  # Gated models redirect unauthenticated requests.
  '^https://huggingface\.co/(CohereLabs|meta-llama)/',
  # DOI links whose publishers (PNAS, Taylor & Francis, OUP, SAGE) answer CI's link checker with 403. Each DOI was
  # confirmed registered via https://doi.org/api/handles/<doi> (200) on 2026-11-23.
  '^https://doi\.org/10\.(1073|1080|1093|1177)/',
  # Local placeholders. (file:// is not excluded: CI remaps links to this repository's main onto the checkout.)
  '^https?://localhost',
]
